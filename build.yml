name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
         packages: 'platform-tools'

      - name: Extract Android project
        run: unzip -q AndroidEmailReader.zip

      - name: Build debug APK
        working-directory: AndroidEmailReader
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmailReader-debug-apk
          path: AndroidEmailReader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
